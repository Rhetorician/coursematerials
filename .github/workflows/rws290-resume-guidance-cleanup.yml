name: RWS290 Resume Guidance cleanup

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/rws290-resume-guidance-cleanup.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Remove extra labels and subtitle
        shell: python
        run: |
          from pathlib import Path

          path = Path("RWS290/ResumeGuidance.html")
          text = path.read_text(encoding="utf-8")

          removals = [
              '''  .hero p:last-child {
    margin: 14px 0 0;
    max-width: 850px;
    color: var(--white);
    font-size: clamp(1rem, 2.4vw, 1.3rem);
  }

''',
              '''  .section-label {
    margin: 30px 0 12px;
    padding: 12px 16px;
    color: var(--white);
    background: var(--red);
    border-left: 8px solid var(--white);
    font-size: 0.95rem;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  .section-label:first-child {
    margin-top: 0;
  }

''',
              '  <p>Resume guidance, examples, and development materials used throughout the resume project.</p>\n',
              '  <div class="section-label">Resume Guidance</div>\n\n',
              '  <div class="section-label">Resume Tools and Examples</div>\n\n',
          ]

          for item in removals:
              if item not in text:
                  raise SystemExit(f"Expected content not found: {item[:80]!r}")
              text = text.replace(item, "", 1)

          path.write_text(text, encoding="utf-8")

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add RWS290/ResumeGuidance.html
          git diff --cached --check
          git commit -m "Simplify RWS290 Resume Guidance page"
          git push origin main
