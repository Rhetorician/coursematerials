name: Temporary Resume Guidance assignment description insert

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/temp-resume-add-description.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Add assignment description first
        shell: python
        run: |
          from pathlib import Path

          path = Path("RWS290/ResumeGuidance.html")
          text = path.read_text(encoding="utf-8")

          if 'aria-controls="panel-assignment"' in text:
              raise SystemExit("Assignment Description panel already exists")

          marker = "<main>\n"
          block = '''<main>\n  <section class="accordion-item">\n    <button class="accordion-button" type="button" aria-expanded="false" aria-controls="panel-assignment">\n      <span class="arrow" aria-hidden="true">➤</span>\n      <span>Assignment Description</span>\n    </button>\n    <div class="accordion-panel" id="panel-assignment">\n      <iframe class="pdf-frame" src="https://rhetorician.github.io/coursematerials/RWS290/files/Resume%20Project%20Description%20Fall%202026.pdf" title="Resume Project Description Fall 2026" loading="lazy"></iframe>\n    </div>\n  </section>\n\n'''

          if marker not in text:
              raise SystemExit("Could not find <main> marker")

          text = text.replace(marker, block, 1)
          path.write_text(text, encoding="utf-8")

      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add RWS290/ResumeGuidance.html
          git diff --cached --check
          git commit -m "Add resume assignment description to guidance"
          git push origin main
