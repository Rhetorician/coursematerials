<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RWS 290 | Writing Persuasive Messages</title>
<style>
:root{--black:#000;--red:#a6192e;--white:#fff;--panel:#f3f3f3;--line:#d6d6d6;--gold:#c8b77a}
*{box-sizing:border-box}html,body{margin:0;background:#000;font-family:Helvetica,Arial,sans-serif;color:#111}.hero{padding:28px 32px;border-top:8px solid var(--red);border-bottom:1px solid #333;background:#000;color:#fff;display:flex;justify-content:space-between;gap:16px;align-items:flex-end;flex-wrap:wrap}.kicker{margin:0 0 6px;color:var(--gold);font-weight:700;letter-spacing:.08em;text-transform:uppercase}h1{margin:0;font-size:clamp(2rem,5vw,3.6rem);line-height:1}.download{display:inline-block;background:var(--red);color:#fff;text-decoration:none;font-weight:700;padding:12px 18px;border:2px solid #fff}main{width:min(1180px,calc(100% - 30px));margin:24px auto 50px}.viewer{background:#fff;border-left:8px solid var(--red);box-shadow:0 8px 22px rgba(0,0,0,.3)}.topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 16px;background:var(--panel);border-bottom:1px solid var(--line);font-weight:700}.slidewrap{padding:16px;background:#fff}#slide{display:block;width:100%;height:auto;border:1px solid var(--line);background:#eee}.controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:14px 16px;border-top:1px solid var(--line)}button{font:inherit;font-weight:700;cursor:pointer;border:0;padding:10px 14px}.primary{background:var(--red);color:#fff}.secondary{background:#fff;color:#111;border:2px solid #111}audio{width:min(520px,100%)}.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(70px,1fr));gap:8px;margin-top:14px}.thumb{padding:6px;border:2px solid transparent;background:#fff}.thumb.active{border-color:var(--red)}.thumb img{width:100%;display:block}@media(max-width:700px){.hero{padding:22px 18px}main{width:min(100% - 18px,1180px)}.controls{align-items:stretch}audio{width:100%}}
</style>
</head>
<body>
<header class="hero"><div><p class="kicker">RWS 290</p><h1>Writing Persuasive Messages</h1></div><a class="download" href="Writing_Persuasive_Messages_Guided_SDSU_Same_Slides.pptx" download>Download PowerPoint</a></header>
<main>
<section class="viewer">
  <div class="topbar"><span id="count">Slide 1 of 12</span><span id="audio-status">Audio available</span></div>
  <div class="slidewrap"><img id="slide" src="slides/slide1.png" alt="Slide 1"></div>
  <div class="controls"><button class="secondary" id="prev">Previous</button><button class="primary" id="next">Next</button><audio id="audio" controls></audio></div>
</section>
<div class="thumbs" id="thumbs"></div>
</main>
<script>
const slides=[{"img": "slides/slide1.png", "audio": "audio/media1.m4a", "title": "Slide 1"}, {"img": "slides/slide2.png", "audio": "audio/media2.m4a", "title": "Slide 2"}, {"img": "slides/slide3.png", "audio": "audio/media3.m4a", "title": "Slide 3"}, {"img": "slides/slide4.png", "audio": "audio/media4.m4a", "title": "Slide 4"}, {"img": "slides/slide5.png", "audio": "audio/media5.m4a", "title": "Slide 5"}, {"img": "slides/slide6.png", "audio": "audio/media6.m4a", "title": "Slide 6"}, {"img": "slides/slide7.png", "audio": "audio/media7.m4a", "title": "Slide 7"}, {"img": "slides/slide8.png", "audio": "audio/media8.m4a", "title": "Slide 8"}, {"img": "slides/slide9.png", "audio": "", "title": "Slide 9"}, {"img": "slides/slide10.png", "audio": "", "title": "Slide 10"}, {"img": "slides/slide11.png", "audio": "", "title": "Slide 11"}, {"img": "slides/slide12.png", "audio": "audio/media9.m4a", "title": "Slide 12"}];
let current=0;
const img=document.getElementById('slide'), audio=document.getElementById('audio'), count=document.getElementById('count'), status=document.getElementById('audio-status'), thumbs=document.getElementById('thumbs');
slides.forEach((s,i)=>{const b=document.createElement('button');b.className='thumb';b.innerHTML='<img src="'+s.img+'" alt="Slide '+(i+1)+' thumbnail">';b.onclick=()=>show(i);thumbs.appendChild(b);});
function show(i){current=Math.max(0,Math.min(slides.length-1,i));const s=slides[current];img.src=s.img;img.alt='Slide '+(current+1);count.textContent='Slide '+(current+1)+' of '+slides.length;if(s.audio){audio.style.display='block';audio.src=s.audio;status.textContent='Audio available';}else{audio.pause();audio.removeAttribute('src');audio.style.display='none';status.textContent='No audio on this slide';}[...thumbs.children].forEach((b,j)=>b.classList.toggle('active',j===current));}
document.getElementById('prev').onclick=()=>show(current-1);document.getElementById('next').onclick=()=>show(current+1);document.addEventListener('keydown',e=>{if(e.key==='ArrowLeft')show(current-1);if(e.key==='ArrowRight')show(current+1);});show(0);
</script>
</body>
</html>
