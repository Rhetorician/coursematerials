<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#000000">
<title>RWS 290 | Resume Guidance</title>
<style>
  :root {
    --black: #000000;
    --charcoal: #1b1b1b;
    --red: #a6192e;
    --red-dark: #761022;
    --white: #ffffff;
    --paper: #ffffff;
    --panel: #f3f3f3;
    --line: #d6d6d6;
    --muted: #5a5a5a;
    --shadow: 0 8px 22px rgba(0, 0, 0, 0.18);
  }

  * {
    box-sizing: border-box;
  }

  html {
    background: var(--black);
    scroll-behavior: smooth;
  }

  body {
    margin: 0;
    background: var(--black);
    color: #111111;
    font-family: Helvetica, Arial, sans-serif;
    font-size: 17px;
    line-height: 1.55;
  }

  .hero {
    padding: clamp(28px, 5vw, 54px);
    color: var(--white);
    background: var(--black);
    border-top: 8px solid var(--red);
    border-bottom: 1px solid #333333;
  }

  .hero-kicker {
    margin: 0 0 8px;
    color: #c8b77a;
    font-size: 0.9rem;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  .hero h1 {
    margin: 0;
    color: var(--white);
    font-size: clamp(2rem, 6vw, 4rem);
    line-height: 1;
  }

  .hero p:last-child {
    margin: 14px 0 0;
    max-width: 850px;
    color: var(--white);
    font-size: clamp(1rem, 2.4vw, 1.3rem);
  }

  main {
    width: min(1180px, calc(100% - 34px));
    margin: 0 auto;
    padding: 30px 0 60px;
  }

  .section-label {
    margin: 30px 0 12px;
    padding: 12px 16px;
    color: var(--white);
    background: var(--red);
    border-left: 8px solid var(--white);
    font-size: 0.95rem;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  .section-label:first-child {
    margin-top: 0;
  }

  .accordion-item {
    margin: 0 0 12px;
    background: var(--paper);
    border-left: 8px solid var(--red);
    box-shadow: var(--shadow);
  }

  .accordion-button {
    width: 100%;
    display: flex;
    align-items: center;
    gap: 13px;
    padding: 17px 20px;
    color: #111111;
    background: var(--panel);
    border: 0;
    border-top: 1px solid var(--line);
    border-right: 1px solid var(--line);
    border-bottom: 1px solid var(--line);
    font: inherit;
    font-size: clamp(1.05rem, 2.8vw, 1.35rem);
    font-weight: 700;
    text-align: left;
    cursor: pointer;
  }

  .accordion-button:hover,
  .accordion-button:focus-visible {
    background: #e8e8e8;
    outline: 3px solid var(--red);
    outline-offset: 2px;
  }

  .accordion-button[aria-expanded="true"] {
    color: var(--white);
    background: var(--black);
    border-color: #333333;
  }

  .arrow {
    flex: 0 0 auto;
    color: var(--red);
    font-size: 1.15em;
    line-height: 1;
    transition: transform 0.2s ease;
  }

  .accordion-button[aria-expanded="true"] .arrow {
    color: var(--white);
    transform: rotate(90deg);
  }

  .accordion-panel {
    display: none;
    padding: 20px;
    background: var(--white);
    border-right: 1px solid var(--line);
    border-bottom: 1px solid var(--line);
  }

  .accordion-panel.open {
    display: block;
  }

  .embed-wrap {
    position: relative;
    width: 100%;
    padding-top: 58.52%;
    overflow: hidden;
    background: var(--black);
    border: 1px solid var(--line);
  }

  .embed-wrap iframe {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    border: 0;
  }

  .doc-frame,
  .pdf-frame {
    display: block;
    width: 100%;
    border: 1px solid var(--line);
    background: #eeeeee;
  }

  .doc-frame {
    height: 680px;
  }

  .pdf-frame {
    height: 780px;
  }

  @media (max-width: 700px) {
    body {
      font-size: 16px;
    }

    main {
      width: min(100% - 20px, 1180px);
      padding-top: 18px;
    }

    .hero {
      padding: 28px 20px;
    }

    .accordion-button {
      padding: 15px 14px;
    }

    .accordion-panel {
      padding: 12px;
    }

    .doc-frame,
    .pdf-frame {
      height: 620px;
    }
  }
</style>
</head>
<body>

<header class="hero">
  <p class="hero-kicker">RWS 290</p>
  <h1>Resume Guidance</h1>
</header>

<main>
  <section class="accordion-item">
    <button class="accordion-button" type="button" aria-expanded="false" aria-controls="panel-assignment">
      <span class="arrow" aria-hidden="true">➤</span>
      <span>Assignment Description</span>
    </button>
    <div class="accordion-panel" id="panel-assignment">
      <iframe class="pdf-frame" src="https://rhetorician.github.io/coursematerials/RWS290/files/Resume%20Project%20Description%20Fall%202026.pdf" title="Resume Project Description Fall 2026" loading="lazy"></iframe>
    </div>
  </section>

  <section class="accordion-item">
    <button class="accordion-button" type="button" aria-expanded="false" aria-controls="panel-basics">
      <span class="arrow" aria-hidden="true">➤</span>
      <span>Resume Basics: Required Sections</span>
    </button>
    <div class="accordion-panel" id="panel-basics">
      <div class="embed-wrap">
        <iframe src="https://docs.google.com/presentation/d/e/2PACX-1vSXibhvVqAddrqKSqWK_WhBiLvkuixNuwYjYSsCI3wvXxrACPGQ_yhE1N5ffXYebw/embed?start=false&amp;loop=false&amp;delayms=3000" title="Resume Basics: Required Sections" loading="lazy" allowfullscreen></iframe>
      </div>
    </div>
  </section>

  <section class="accordion-item">
    <button class="accordion-button" type="button" aria-expanded="false" aria-controls="panel-design">
      <span class="arrow" aria-hidden="true">➤</span>
      <span>Resume Design and Development</span>
    </button>
    <div class="accordion-panel" id="panel-design">
      <div class="embed-wrap">
        <iframe src="https://docs.google.com/presentation/d/e/2PACX-1vQ6aCLPTwtgPBticJ3JGb8_NuvUFSlimjO7eoJvRJujX50mfeRoYXOywi0p5Pb4tA/embed?start=false&amp;loop=true&amp;delayms=15000" title="Resume Design and Development" loading="lazy" allowfullscreen></iframe>
      </div>
    </div>
  </section>

  <section class="accordion-item">
    <button class="accordion-button" type="button" aria-expanded="false" aria-controls="panel-objective">
      <span class="arrow" aria-hidden="true">➤</span>
      <span>Objective vs. Profile</span>
    </button>
    <div class="accordion-panel" id="panel-objective">
      <div class="embed-wrap">
        <iframe src="https://docs.google.com/presentation/d/e/2PACX-1vTcjsUbjDm_JN6yp69TVRCvNQjNi5LhAQa5_XugDF6JkPHDCNugnmF9XsOHf374RQ/embed?start=true&amp;loop=true&amp;delayms=15000" title="Objective vs. Profile" loading="lazy" allowfullscreen></iframe>
      </div>
    </div>
  </section>

  <section class="accordion-item">
    <button class="accordion-button" type="button" aria-expanded="false" aria-controls="panel-types">
      <span class="arrow" aria-hidden="true">➤</span>
      <span>Resume Types</span>
    </button>
    <div class="accordion-panel" id="panel-types">
      <div class="embed-wrap">
        <iframe src="https://docs.google.com/presentation/d/e/2PACX-1vRIF2mdKo01dotASIJ6EXf37DzPxSGTu3jbXXn5Md0vQUfgear5PL57kbolau1UkQ/embed?start=false&amp;loop=true&amp;delayms=15000" title="Resume Types" loading="lazy" allowfullscreen></iframe>
      </div>
    </div>
  </section>

  <section class="accordion-item">
    <button class="accordion-button" type="button" aria-expanded="false" aria-controls="panel-experience-one">
      <span class="arrow" aria-hidden="true">➤</span>
      <span>Effective Experience Sections Part I</span>
    </button>
    <div class="accordion-panel" id="panel-experience-one">
      <div class="embed-wrap">
        <iframe src="https://docs.google.com/presentation/d/e/2PACX-1vTkZvmOaSXDPOEfTxXBbI4kmGq8laiIhwj26Gk-EKvsZ1C3O91tu2RhsG0N8_2t_g/embed?start=false&amp;loop=true&amp;delayms=15000" title="Effective Experience Sections Part I" loading="lazy" allowfullscreen></iframe>
      </div>
    </div>
  </section>

  <section class="accordion-item">
    <button class="accordion-button" type="button" aria-expanded="false" aria-controls="panel-experience-two">
      <span class="arrow" aria-hidden="true">➤</span>
      <span>Effective Experience Sections Part II</span>
    </button>
    <div class="accordion-panel" id="panel-experience-two">
      <iframe class="doc-frame" src="https://docs.google.com/document/d/e/2PACX-1vQ_QwN5zxmbVWiHhMj8rRWXro9bW2RWG8B0LVoae6zZGx9QHaGs4CFnEyE4WwHxQw/pub?embedded=true" title="Effective Experience Sections Part II" loading="lazy"></iframe>
    </div>
  </section>

  <section class="accordion-item">
    <button class="accordion-button" type="button" aria-expanded="false" aria-controls="panel-verbs">
      <span class="arrow" aria-hidden="true">➤</span>
      <span>Power Verbs</span>
    </button>
    <div class="accordion-panel" id="panel-verbs">
      <iframe class="pdf-frame" src="https://rhetorician.github.io/coursematerials/RWS305/files/Project%201/Resume%20Power%20Verbs.pdf" title="Resume Power Verbs" loading="lazy"></iframe>
    </div>
  </section>

  <section class="accordion-item">
    <button class="accordion-button" type="button" aria-expanded="false" aria-controls="panel-chronological">
      <span class="arrow" aria-hidden="true">➤</span>
      <span>Traditional &quot;Chronological&quot; Example</span>
    </button>
    <div class="accordion-panel" id="panel-chronological">
      <iframe class="pdf-frame" src="https://rhetorician.github.io/coursematerials/RWS305/files/Project%201/Elizabeth%20Cooper%20Chronological%20Resume%20Example.pdf" title="Traditional Chronological Resume Example" loading="lazy"></iframe>
    </div>
  </section>

  <section class="accordion-item">
    <button class="accordion-button" type="button" aria-expanded="false" aria-controls="panel-skills">
      <span class="arrow" aria-hidden="true">➤</span>
      <span>Skills Resume</span>
    </button>
    <div class="accordion-panel" id="panel-skills">
      <iframe class="pdf-frame" src="https://rhetorician.github.io/coursematerials/RWS305/files/Project%201/Monika%20Mosher%20Skills%20Resume%20Example.pdf" title="Skills Resume Example" loading="lazy"></iframe>
    </div>
  </section>

  <section class="accordion-item">
    <button class="accordion-button" type="button" aria-expanded="false" aria-controls="panel-skills-howto">
      <span class="arrow" aria-hidden="true">➤</span>
      <span>Skills Resume How-To</span>
    </button>
    <div class="accordion-panel" id="panel-skills-howto">
      <iframe class="pdf-frame" src="https://rhetorician.github.io/coursematerials/RWS305/files/Project%201/Developing%20a%20Skills%20Section%20(305W).pdf" title="Developing a Skills Section" loading="lazy"></iframe>
    </div>
  </section>
</main>

<script>
  const buttons = Array.from(document.querySelectorAll('.accordion-button'));

  function closePanel(button) {
    const panel = document.getElementById(button.getAttribute('aria-controls'));
    button.setAttribute('aria-expanded', 'false');
    panel.classList.remove('open');
  }

  function openPanel(button) {
    const panel = document.getElementById(button.getAttribute('aria-controls'));
    button.setAttribute('aria-expanded', 'true');
    panel.classList.add('open');
  }

  buttons.forEach((button) => {
    button.addEventListener('click', () => {
      const alreadyOpen = button.getAttribute('aria-expanded') === 'true';

      buttons.forEach((otherButton) => {
        if (otherButton !== button) {
          closePanel(otherButton);
        }
      });

      if (alreadyOpen) {
        closePanel(button);
      } else {
        openPanel(button);
        setTimeout(() => {
          button.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }, 80);
      }
    });
  });
</script>

</body>
</html>
