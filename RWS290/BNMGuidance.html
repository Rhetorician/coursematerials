<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#000000">
<title>RWS 290 | Bad-News Message Guidance</title>
<style>
  :root {
    --black: #000000;
    --red: #a6192e;
    --white: #ffffff;
    --paper: #ffffff;
    --panel: #f3f3f3;
    --line: #d6d6d6;
    --shadow: 0 8px 22px rgba(0, 0, 0, 0.18);
  }

  * {
    box-sizing: border-box;
  }

  html {
    background: var(--black);
    scroll-behavior: smooth;
  }

  body {
    margin: 0;
    background: var(--black);
    color: #111111;
    font-family: Helvetica, Arial, sans-serif;
    font-size: 17px;
    line-height: 1.55;
  }

  .hero {
    padding: clamp(28px, 5vw, 54px);
    color: var(--white);
    background: var(--black);
    border-top: 8px solid var(--red);
    border-bottom: 1px solid #333333;
  }

  .hero-kicker {
    margin: 0 0 8px;
    color: #c8b77a;
    font-size: 0.9rem;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  .hero h1 {
    margin: 0;
    color: var(--white);
    font-size: clamp(2rem, 6vw, 4rem);
    line-height: 1;
  }

  main {
    width: min(1180px, calc(100% - 34px));
    margin: 0 auto;
    padding: 30px 0 60px;
  }

  .accordion-item {
    margin: 0 0 12px;
    background: var(--paper);
    border-left: 8px solid var(--red);
    box-shadow: var(--shadow);
  }

  .accordion-button {
    width: 100%;
    display: flex;
    align-items: center;
    gap: 13px;
    padding: 17px 20px;
    color: #111111;
    background: var(--panel);
    border: 0;
    border-top: 1px solid var(--line);
    border-right: 1px solid var(--line);
    border-bottom: 1px solid var(--line);
    font: inherit;
    font-size: clamp(1.05rem, 2.8vw, 1.35rem);
    font-weight: 700;
    text-align: left;
    cursor: pointer;
  }

  .accordion-button:hover,
  .accordion-button:focus-visible {
    background: #e8e8e8;
    outline: 3px solid var(--red);
    outline-offset: 2px;
  }

  .accordion-button[aria-expanded="true"] {
    color: var(--white);
    background: var(--black);
    border-color: #333333;
  }

  .arrow {
    flex: 0 0 auto;
    color: var(--red);
    font-size: 1.15em;
    line-height: 1;
    transition: transform 0.2s ease;
  }

  .accordion-button[aria-expanded="true"] .arrow {
    color: var(--white);
    transform: rotate(90deg);
  }

  .accordion-panel {
    display: none;
    padding: 20px;
    background: var(--white);
    border-right: 1px solid var(--line);
    border-bottom: 1px solid var(--line);
  }

  .accordion-panel.open {
    display: block;
  }

  .embed-wrap {
    position: relative;
    width: 100%;
    padding-top: 58.52%;
    overflow: hidden;
    background: var(--black);
    border: 1px solid var(--line);
  }

  .embed-wrap iframe {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    border: 0;
  }

  .pdf-frame {
    display: block;
    width: 100%;
    height: 780px;
    border: 1px solid var(--line);
    background: #eeeeee;
  }

  @media (max-width: 700px) {
    body {
      font-size: 16px;
    }

    main {
      width: min(100% - 20px, 1180px);
      padding-top: 18px;
    }

    .hero {
      padding: 28px 20px;
    }

    .accordion-button {
      padding: 15px 14px;
    }

    .accordion-panel {
      padding: 12px;
    }

    .pdf-frame {
      height: 620px;
    }
  }
</style>
</head>
<body>

<header class="hero">
  <p class="hero-kicker">RWS 290</p>
  <h1>Bad-News Message Guidance</h1>
</header>

<main>
  <section class="accordion-item">
    <button class="accordion-button" type="button" aria-expanded="false" aria-controls="panel-assignment">
      <span class="arrow" aria-hidden="true">➤</span>
      <span>Assignment Description</span>
    </button>
    <div class="accordion-panel" id="panel-assignment">
      <iframe class="pdf-frame" src="https://rhetorician.github.io/coursematerials/RWS290/files/Bad-News%20Messages%20Assignment%20Description.pdf" title="Bad-News Messages Assignment Description" loading="lazy"></iframe>
    </div>
  </section>

  <section class="accordion-item">
    <button class="accordion-button" type="button" aria-expanded="false" aria-controls="panel-overview">
      <span class="arrow" aria-hidden="true">➤</span>
      <span>Bad-News Messages: Overview and Project Planning</span>
    </button>
    <div class="accordion-panel" id="panel-overview">
      <div class="embed-wrap">
        <iframe src="https://docs.google.com/presentation/d/e/2PACX-1vSy_wqCzSdB5jb0eTZH9h7cXnN5S9_9-hpcErjhdJtAnQSH4qbH0FRmu1eAz__PQQ/embed?start=false&amp;loop=false&amp;delayms=5000" title="Bad-News Messages: Overview and Project Planning" loading="lazy" allowfullscreen></iframe>
      </div>
    </div>
  </section>

  <section class="accordion-item">
    <button class="accordion-button" type="button" aria-expanded="false" aria-controls="panel-mozart">
      <span class="arrow" aria-hidden="true">➤</span>
      <span>Prompt 1: Refused Request - Mozart Collegium Gala</span>
    </button>
    <div class="accordion-panel" id="panel-mozart">
      <iframe class="pdf-frame" src="https://rhetorician.github.io/coursematerials/RWS290/files/Refused%20Request%20-%20Mozart%20Collegium%20Gala.pdf" title="Prompt 1: Refused Request - Mozart Collegium Gala" loading="lazy"></iframe>
    </div>
  </section>

  <section class="accordion-item">
    <button class="accordion-button" type="button" aria-expanded="false" aria-controls="panel-yoga">
      <span class="arrow" aria-hidden="true">➤</span>
      <span>Prompt 2: Indirect Claim Letter - Pilgrimage Yoga Studio</span>
    </button>
    <div class="accordion-panel" id="panel-yoga">
      <iframe class="pdf-frame" src="https://rhetorician.github.io/coursematerials/RWS290/files/Indirect%20Claim%20Letter%20-%20Pilgrimage%20Yoga%20Studio.pdf" title="Prompt 2: Indirect Claim Letter - Pilgrimage Yoga Studio" loading="lazy"></iframe>
    </div>
  </section>

  <section class="accordion-item">
    <button class="accordion-button" type="button" aria-expanded="false" aria-controls="panel-alliance">
      <span class="arrow" aria-hidden="true">➤</span>
      <span>Prompt 3: Adjustment Refusal - Alliance Pest Control</span>
    </button>
    <div class="accordion-panel" id="panel-alliance">
      <iframe class="pdf-frame" src="https://rhetorician.github.io/coursematerials/RWS290/files/Adjustment%20Refusal%20-%20Alliance%20Pest%20Control.pdf" title="Prompt 3: Adjustment Refusal - Alliance Pest Control" loading="lazy"></iframe>
    </div>
  </section>

  <section class="accordion-item">
    <button class="accordion-button" type="button" aria-expanded="false" aria-controls="panel-dental">
      <span class="arrow" aria-hidden="true">➤</span>
      <span>Prompt 4: Negative Announcement - Ybarra Dental Group</span>
    </button>
    <div class="accordion-panel" id="panel-dental">
      <iframe class="pdf-frame" src="https://rhetorician.github.io/coursematerials/RWS290/files/Negative%20Announcement%20-%20Ybarra%20Dental%20Group.pdf" title="Prompt 4: Negative Announcement - Ybarra Dental Group" loading="lazy"></iframe>
    </div>
  </section>
</main>

<script>
  const buttons = Array.from(document.querySelectorAll('.accordion-button'));

  function closePanel(button) {
    const panel = document.getElementById(button.getAttribute('aria-controls'));
    button.setAttribute('aria-expanded', 'false');
    panel.classList.remove('open');
  }

  function openPanel(button) {
    const panel = document.getElementById(button.getAttribute('aria-controls'));
    button.setAttribute('aria-expanded', 'true');
    panel.classList.add('open');
  }

  buttons.forEach((button) => {
    button.addEventListener('click', () => {
      const alreadyOpen = button.getAttribute('aria-expanded') === 'true';

      buttons.forEach((otherButton) => {
        if (otherButton !== button) {
          closePanel(otherButton);
        }
      });

      if (alreadyOpen) {
        closePanel(button);
      } else {
        openPanel(button);
        setTimeout(() => {
          button.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }, 80);
      }
    });
  });
</script>

</body>
</html>
