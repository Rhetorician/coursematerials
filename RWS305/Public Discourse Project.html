<!DOCTYPE html>
<html lang="en">

<head>

<meta name="viewport" content="width=device-width, initial-scale=1">

<style>

* {
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
}

body,
html {
  margin: 0;
  font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
  background-color: #ffffff;
  color: #111111;
}


/* PAGE HEADER */

.page-header {
  background-color: #000000;
  color: #ffffff;
  padding: 28px 30px;
}

.page-header .course-label {
  margin: 0 0 6px 0;
  color: #ffffff;
  font-size: 11pt;
  font-weight: bold;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}

.page-header h1 {
  margin: 0;
  color: #ffffff;
  font-size: 30pt;
  line-height: 1.1;
}

.page-content {
  padding: 28px 30px;
}

.introduction {
  margin: 0 0 24px 0;
  font-size: 14pt;
  line-height: 1.55;
}


/* ACCORDIONS */

.collapsible {
  background-color: #000000;
  color: #ffffff;
  cursor: pointer;
  padding: 18px 20px;
  width: 100%;
  border: none;
  border-bottom: 1px solid #ffffff;
  text-align: left;
  outline: none;
  font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
  font-size: 18pt;
  font-weight: bold;
  line-height: 1.3;
  margin: 0;
}

.collapsible:hover,
.collapsible.active {
  background-color: #333333;
}

.arrow::before {
  content: "➤";
  display: inline-block;
  margin-right: 10px;
  transition: transform 0.2s ease;
}

.collapsible.active .arrow::before {
  transform: rotate(90deg);
}

.content {
  max-height: 0;
  overflow: hidden;
  transition: max-height 0.25s ease-out;
  background-color: #ffffff;
}

.content-inner {
  padding: 22px;
  border: 1px solid #000000;
  border-top: none;
}


/* EMBEDS */

iframe {
  display: block;
  width: 100%;
  border: 1px solid #000000;
  background-color: #ffffff;
}

.video-frame {
  height: 680px;
  min-height: 520px;
  background-color: #000000;
}

.pdf-frame {
  height: 760px;
  min-height: 600px;
  background-color: #eeeeee;
}

</style>

</head>

<body>


<div class="page-header">

  <p class="course-label">
    RWS 305W
  </p>

  <h1>
    Project Materials
  </h1>

</div>


<div class="page-content">

  <p class="introduction">
    These readings and videos provide material you may draw from as you develop your presentation.
  </p>


  <!-- START HERE -->

  <button class="collapsible" aria-expanded="false">
    <span class="arrow"></span>
    Start Here
  </button>

  <div class="content">

    <div class="content-inner">

      <iframe
        class="video-frame"
        title="Start Here"
        src="https://www.youtube.com/embed/EN8a7OPJE-U"
        loading="lazy"
        allowfullscreen="allowfullscreen"
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture">
      </iframe>

    </div>

  </div>


  <!-- IDENTITY CAPITAL -->

  <button class="collapsible" aria-expanded="false">
    <span class="arrow"></span>
    Identity Capital
  </button>

  <div class="content">

    <div class="content-inner">

      <iframe
        class="pdf-frame"
        title="Identity Capital"
        src="https://rhetorician.github.io/coursematerials/RWS305/files/Project%204/Identity%20Capital%20(Excerpt).pdf"
        loading="lazy">
      </iframe>

    </div>

  </div>


  <!-- MY LIFE SHOULD LOOK BETTER -->

  <button class="collapsible" aria-expanded="false">
    <span class="arrow"></span>
    My Life Should Look Better
  </button>

  <div class="content">

    <div class="content-inner">

      <iframe
        class="pdf-frame"
        title="My Life Should Look Better on Facebook"
        src="https://rhetorician.github.io/coursematerials/RWS305/files/Project%204/My%20Life%20Should%20Look%20Better%20on%20Facebook%20(Excerpt).pdf"
        loading="lazy">
      </iframe>

    </div>

  </div>


  <!-- WEAK TIES -->

  <button class="collapsible" aria-expanded="false">
    <span class="arrow"></span>
    Weak Ties
  </button>

  <div class="content">

    <div class="content-inner">

      <iframe
        class="pdf-frame"
        title="Weak Ties"
        src="https://rhetorician.github.io/coursematerials/RWS305/files/Project%204/Weak%20Ties%20(Excerpt).pdf"
        loading="lazy">
      </iframe>

    </div>

  </div>


  <!-- 30 IS NOT THE NEW 20 -->

  <button class="collapsible" aria-expanded="false">
    <span class="arrow"></span>
    30 is not the new 20
  </button>

  <div class="content">

    <div class="content-inner">

      <iframe
        class="video-frame"
        title="30 is not the new 20"
        src="https://www.youtube.com/embed/vhhgI4tSMwc"

        allowfullscreen="allowfullscreen"
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture">
      </iframe>

    </div>

  </div>


  <!-- MINDSET -->

  <button class="collapsible" aria-expanded="false">
    <span class="arrow"></span>
    Mindset
  </button>

  <div class="content">

    <div class="content-inner">

      <iframe
        class="video-frame"
        title="Mindset"
        src="https://www.youtube.com/embed/_X0mgOOSpLU"
        loading="lazy"
        allowfullscreen="allowfullscreen"
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture">
      </iframe>

    </div>

  </div>


  <!-- GRIT -->

  <button class="collapsible" aria-expanded="false">
    <span class="arrow"></span>
    Grit
  </button>

  <div class="content">

    <div class="content-inner">

      <iframe
        class="video-frame"
        title="Grit"
        src="https://www.youtube.com/embed/H14bBuluwB8"
        loading="lazy"
        allowfullscreen="allowfullscreen"
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture">

  </div>


  <!-- SUCCESS -->

  <button class="collapsible" aria-expanded="false">
    <span class="arrow"></span>
    Success
  </button>

  <div class="content">

    <div class="content-inner">

      <iframe
        class="video-frame"
        title="Success"
        src="https://www.youtube.com/embed/jpe-LKn-4gM"
        loading="lazy"
        allowfullscreen="allowfullscreen"
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture">
      </iframe>

    </div>

  </div>

</div>


<script>

const buttons = document.querySelectorAll(".collapsible");


function updateHeight(content) {

  if (
    content &&
    content.previousElementSibling &&
    content.previousElementSibling.classList.contains("active")
  ) {
    content.style.maxHeight = content.scrollHeight + "px";
  }

}


buttons.forEach(function(button) {

  button.addEventListener("click", function() {

    const content = button.nextElementSibling;
    const wasOpen = button.classList.contains("active");


    /*
      Close all sections.
    */

    buttons.forEach(function(otherButton) {

      const otherContent = otherButton.nextElementSibling;

      otherButton.classList.remove("active");
      otherButton.setAttribute("aria-expanded", "false");

      if (otherContent) {
        otherContent.style.maxHeight = null;
      }

    });


    /*
      Open the selected section.
    */

    if (!wasOpen) {

      button.classList.add("active");
      button.setAttribute("aria-expanded", "true");

      content.style.maxHeight = content.scrollHeight + "px";


      /*
        Recalculate once the section begins opening.
      */

      setTimeout(function() {

        updateHeight(content);

      }, 100);


      /*
        Bring the selected section into view.
      */

      setTimeout(function() {

        button.scrollIntoView({
          behavior: "smooth",
          block: "start"
        });

      }, 180);

    }

  });

});


/*
  Recalculate when an embedded item finishes loading.
*/

document.querySelectorAll("iframe").forEach(function(frame) {

  frame.addEventListener("load", function() {

    const content = frame.closest(".content");

    if (content) {
      updateHeight(content);
    }

  });

});


/*
  Recalculate if the browser size changes.
*/

window.addEventListener("resize", function() {

  const openButton = document.querySelector(".collapsible.active");

  if (openButton) {

    const openContent = openButton.nextElementSibling;

    updateHeight(openContent);

  }

});

</script>


</body>

</html>
