<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RWS 305W, Section 57 | Fall 2026 Syllabus</title>
</head>
<body>
<p style="font-family: Helvetica, Arial, sans-serif; padding: 24px;">Loading syllabus...</p>
<script>
(async function () {
  try {
    let html = await fetch('./SyllabusBaseFall2026.html?v=20260909zoom', { cache: 'no-store' }).then(function (response) {
      if (!response.ok) {
        throw new Error('Unable to load syllabus source.');
      }
      return response.text();
    });

    html = html.split('<dt>Office location</dt>\n<dd>Zoom</dd>').join('<dt>Office location</dt>\n<dd><a href="https://sdsu.zoom.us/j/85270281161" rel="noopener" target="_blank">Zoom</a></dd>');

    document.open();
    document.write(html);
    document.close();
  } catch (error) {
    document.body.innerHTML = '<p style="font-family: Helvetica, Arial, sans-serif; padding: 24px;"><strong>The syllabus could not be loaded.</strong></p>';
    console.error(error);
  }
}());
</script>
</body>
</html>
